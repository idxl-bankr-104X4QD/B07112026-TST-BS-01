<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Нормативна база АК</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: sticky search bar on top; left rail = acts + contents of the open act; right = reader, one article at a time. */
:root{
  --bg:#f5f6f8; --panel:#ffffff; --ink:#1a2230; --muted:#5d6879; --line:#dde1e8;
  --accent:#1d4f8f; --accent-soft:#e6eef8; --hit:#ffe58a; --hit-ink:#1a2230;
  --ui:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --read:'Source Serif 4',Georgia,'Times New Roman',serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161d; --panel:#1a202a; --ink:#e4e8ef; --muted:#9aa5b6; --line:#2b3340;
  --accent:#7fb0ee; --accent-soft:#1f2c40; --hit:#6b5a12; --hit-ink:#fff4c4; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161d; --panel:#1a202a; --ink:#e4e8ef; --muted:#9aa5b6; --line:#2b3340;
  --accent:#7fb0ee; --accent-soft:#1f2c40; --hit:#6b5a12; --hit-ink:#fff4c4; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--ui);padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.wrap{max-width:1240px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 0 10px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{font:600 16px var(--ui);margin:0;letter-spacing:.01em;white-space:nowrap}
.sw{flex:1 1 320px;position:relative;min-width:0}
#q{width:100%;font:16px var(--ui);padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
#q:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.stat{font-size:12px;color:var(--muted);white-space:nowrap}
main{display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;padding:16px 0 48px;align-items:start}
nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);max-height:calc(100vh - 90px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px}
.act{display:block;width:100%;text-align:left;background:none;border:0;border-radius:4px;padding:8px 10px;color:var(--ink);font:500 14px/1.35 var(--ui);cursor:pointer}
.act small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.act[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
.act:hover{background:var(--accent-soft)}
.toc{margin:4px 0 8px 10px;border-left:1px solid var(--line)}
.toc a{display:block;padding:4px 10px;font-size:13px;line-height:1.35;color:var(--muted);text-decoration:none;cursor:pointer}
.toc a:hover{color:var(--accent)}
.toc a[aria-current="true"]{color:var(--accent);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.chip{font:12px var(--ui);padding:4px 10px;border:1px solid var(--line);border-radius:99px;background:var(--panel);color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:20px 24px;min-width:0}
.meta{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:0 0 6px}
h2{font:600 22px/1.3 var(--read);margin:0 0 14px;text-wrap:balance}
.text p{font:18px/1.65 var(--read);margin:0 0 .75em;max-width:72ch}
.text p.note{font:13px/1.5 var(--ui);color:var(--muted)}
mark{background:var(--hit);color:var(--hit-ink);padding:0 1px;border-radius:2px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:20px;padding-top:14px;border-top:1px solid var(--line)}
.pager button{font:14px var(--ui);padding:8px 14px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);cursor:pointer;max-width:48%;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pager button:disabled{opacity:.4;cursor:default}
.res{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.res button{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px;color:var(--ink);cursor:pointer;font:inherit}
.res button:hover{border-color:var(--accent)}
.res b{display:block;font:600 15px/1.35 var(--read)}
.res .src{font-size:12px;color:var(--muted)}
.res .sn{font:15px/1.5 var(--read);margin-top:4px;color:var(--ink)}
.empty{color:var(--muted);padding:32px 8px;text-align:center}
.menu{display:none;font:14px var(--ui);padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);cursor:pointer}
@media (max-width:820px){
  main{grid-template-columns:minmax(0,1fr)}
  nav{position:static;max-height:60vh}
  .menu{display:inline-block;margin-bottom:12px}
  nav.closed{display:none}
  .card{padding:16px}
  .text p{font-size:17px}
}
</style></head><body>

<div class="wrap">
<header>
  <h1>Нормативна база</h1>
  <div class="sw"><input id="q" type="search" placeholder="Поиск по всем актам: слово, фраза или номер статьи" autocomplete="off" aria-label="Поиск"></div>
  <span class="stat" id="stat">Загрузка…</span>
</header>
<main>
  <div style="min-width:0">
    <button class="menu" id="menu" type="button">Акты и содержание</button>
    <nav id="nav" class="closed" aria-label="Акты"></nav>
  </div>
  <section id="view" aria-live="polite"><div class="empty">Загружаю тексты актов…</div></section>
</main>
</div>

<script>
(function(){
var ACTS=[],SECS=[],cur={act:null,i:0},filter='all',navEl=document.getElementById('nav'),view=document.getElementById('view'),qEl=document.getElementById('q'),stat=document.getElementById('stat');
function esc(s){return s.replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function norm(s){return s.toLowerCase().replace(/[’ʼ`']/g,"'")}
function rx(words){return new RegExp('('+words.map(function(w){return w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}).join('|')+')','gi')}
function hl(txt,words){var h=esc(txt);if(!words.length)return h;return h.replace(rx(words.map(esc)),'<mark>$1</mark>')}
function actOf(id){return ACTS.filter(function(a){return a.id===id})[0]}
function secsOf(id){return SECS.filter(function(s){return s.act===id})}

function renderNav(){
  var h='';
  ACTS.forEach(function(a){
    var on=cur.act===a.id;
    h+='<button class="act" data-act="'+a.id+'" aria-current="'+on+'" type="button">'+esc(a.title)+'<small>'+esc(a.sub)+'</small></button>';
    if(on){h+='<div class="toc">';secsOf(a.id).forEach(function(s){h+='<a data-act="'+a.id+'" data-i="'+s.i+'" aria-current="'+(cur.i===s.i)+'">'+esc(s.t)+'</a>'});h+='</div>'}
  });
  navEl.innerHTML=h;
  var c=navEl.querySelector('.toc a[aria-current="true"]');if(c&&c.scrollIntoView)try{c.scrollIntoView({block:'nearest'})}catch(e){}
}
function open(act,i,words){
  cur={act:act,i:i};qEl.value=words&&words.q?words.q:qEl.value;
  var list=secsOf(act),s=list[i];if(!s)return;
  var a=actOf(act),w=(words&&words.w)||[];
  var body=s.x.split('\n').map(function(p){return '<p'+(p.charAt(0)==='{'?' class="note"':'')+'>'+hl(p,w)+'</p>'}).join('');
  view.innerHTML='<div class="card"><p class="meta">'+esc(a.title)+' · '+(i+1)+' из '+list.length+'</p><h2>'+hl(s.t,w)+'</h2><div class="text">'+body+'</div>'+
   '<div class="pager"><button type="button" data-go="-1" '+(i?'':'disabled')+'>← '+esc(i?list[i-1].t:'')+'</button><button type="button" data-go="1" '+(i<list.length-1?'':'disabled')+'>'+esc(i<list.length-1?list[i+1].t:'')+' →</button></div></div>';
  renderNav();window.scrollTo(0,0);
  try{history.replaceState(null,'','#'+act+'-'+i)}catch(e){}
}
function search(q){
  q=q.trim();if(!q){open(cur.act||ACTS[0].id,cur.act?cur.i:0);return}
  var words=norm(q).split(/\s+/).filter(Boolean),res=[];
  SECS.forEach(function(s){
    if(filter!=='all'&&s.act!==filter)return;
    var ok=true,n=0,tl=norm(s.t);
    words.forEach(function(w){var p=s.lc.indexOf(w);if(p<0&&tl.indexOf(w)<0)ok=false;else{var c=0,k=-1;while((k=s.lc.indexOf(w,k+1))>=0&&c<200)c++;n+=c}});
    if(!ok)return;
    var score=n+(words.every(function(w){return tl.indexOf(w)>=0})?50:0)+(/^стаття\s+\d/.test(tl)&&words.length===1&&/^\d+$/.test(words[0])&&tl.indexOf('стаття '+words[0]+'.')===0?500:0);
    res.push({s:s,score:score});
  });
  res.sort(function(a,b){return b.score-a.score});
  var chips='<div class="chips"><button class="chip" data-f="all" aria-pressed="'+(filter==='all')+'" type="button">Все акты</button>'+ACTS.map(function(a){return '<button class="chip" data-f="'+a.id+'" aria-pressed="'+(filter===a.id)+'" type="button">'+esc(a.title.replace('Порядок ','').replace('Кодекс України з процедур банкрутства','Кодекс'))+'</button>'}).join('')+'</div>';
  if(!res.length){view.innerHTML=chips+'<div class="empty">Ничего не найдено по запросу «'+esc(q)+'».</div>';return}
  var shown=res.slice(0,80),h=chips+'<p class="meta">Найдено разделов: '+res.length+(res.length>80?' (показаны первые 80)':'')+'</p><ul class="res">';
  shown.forEach(function(r){
    var s=r.s,p=s.lc.indexOf(words[0]);if(p<0)p=0;
    var from=Math.max(0,p-90),sn=(from?'…':'')+s.x.slice(from,from+260).replace(/\n/g,' ')+'…';
    h+='<li><button type="button" data-act="'+s.act+'" data-i="'+s.i+'"><span class="src">'+esc(actOf(s.act).title)+'</span><b>'+hl(s.t,words)+'</b><div class="sn">'+hl(sn,words)+'</div></button></li>';
  });
  view.innerHTML=h+'</ul>';window.__w={q:q,w:words};
}
var tm;qEl.addEventListener('input',function(){clearTimeout(tm);tm=setTimeout(function(){search(qEl.value)},180)});
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act],[data-f],[data-go],#menu');if(!t)return;
  if(t.id==='menu'){navEl.classList.toggle('closed');return}
  if(t.dataset.f){filter=t.dataset.f;search(qEl.value);return}
  if(t.dataset.go){open(cur.act,cur.i+Number(t.dataset.go));return}
  var a=t.dataset.act,i=t.dataset.i?Number(t.dataset.i):0,inRes=!!t.closest('.res'),w=inRes&&window.__w?{q:window.__w.q,w:window.__w.w}:null;
  if(!inRes)qEl.value='';
  open(a,i,w);if(window.innerWidth<=820)navEl.classList.add('closed');
});
function boot(){
  stat.textContent=ACTS.length+' акта · '+SECS.length+' разделов';
  var m=/^#([a-z]+)-(\d+)$/.exec(location.hash||'');
  if(m&&actOf(m[1])){open(m[1],Number(m[2]))}else open(ACTS[0].id,0);
  navEl.classList.remove('closed');if(window.innerWidth<=820)navEl.classList.add('closed');
}
function fail(msg){stat.textContent='';view.innerHTML='<div class="empty">'+msg+'</div>'}
function load(){
  fetch('data/index.json').then(function(r){if(!r.ok)throw new Error('index.json: '+r.status);return r.json()}).then(function(list){
    ACTS=list.sort(function(a,b){return a.order-b.order});
    return Promise.all(ACTS.map(function(a){return fetch('data/'+a.id+'.json').then(function(r){if(!r.ok)throw new Error(a.id+': '+r.status);return r.json()})}));
  }).then(function(docs){
    docs.forEach(function(d){d.secs.forEach(function(s,i){SECS.push({act:d.id,i:i,t:s.t,x:s.x,lc:norm(s.x)})})});
    boot();
  }).catch(function(e){fail('Не удалось загрузить тексты. Откройте сайт по его веб-ссылке, а не файлом с компьютера. ('+esc(String(e&&e.message||e))+')')});
}
load();
})();
</script>
</body></html>
