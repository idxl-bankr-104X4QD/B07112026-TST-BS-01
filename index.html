<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Нормативна база АК</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#eef0f3; --panel:#ffffff; --ink:#1b2230; --muted:#5d6879; --line:#d9dde4;
  --accent:#1d4f8f; --accent-soft:#e6eef8; --hit:#ffe58a; --hit-ink:#1a2230;
  --ui:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --serif:'Times New Roman',Times,'Liberation Serif',serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161d; --panel:#1a202a; --ink:#e4e8ef; --muted:#9aa5b6; --line:#2b3340;
  --accent:#7fb0ee; --accent-soft:#1f2c40; --hit:#6b5a12; --hit-ink:#fff4c4; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161d; --panel:#1a202a; --ink:#e4e8ef; --muted:#9aa5b6; --line:#2b3340;
  --accent:#7fb0ee; --accent-soft:#1f2c40; --hit:#6b5a12; --hit-ink:#fff4c4; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--ui);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1280px;margin:0 auto}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
h1{font:600 16px var(--ui);margin:0;white-space:nowrap}
.sw{flex:1 1 300px;min-width:0}
#q{width:100%;font:16px var(--ui);padding:9px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
#q:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.stat{font-size:12px;color:var(--muted);white-space:nowrap}
#theme{font:13px var(--ui);padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);cursor:pointer;white-space:nowrap}
main{display:grid;grid-template-columns:330px minmax(0,1fr);gap:20px;padding:14px 0 48px;align-items:start}
nav{position:sticky;top:64px;max-height:calc(100vh - 80px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px}
.act{display:grid;grid-template-columns:16px minmax(0,1fr);column-gap:4px;width:100%;text-align:left;background:none;border:0;border-radius:4px;padding:7px 8px;color:var(--ink);font:500 13.5px/1.35 var(--ui);cursor:pointer}
.act .chev{grid-row:1;color:var(--muted);font-size:11px;line-height:1.9}
.act .nm{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.act small{grid-column:2;display:block;margin-top:3px;font:400 11.5px/1.35 var(--ui);color:var(--muted)}
.act[aria-current="true"]{background:var(--accent-soft)}
.act[aria-current="true"] .nm{color:var(--accent)}
.act:hover{background:var(--accent-soft)}
.toc{margin:2px 0 8px 14px;border-left:1px solid var(--line)}
.toc a{display:block;padding:3px 10px;font-size:12.5px;line-height:1.35;color:var(--muted);cursor:pointer;overflow-wrap:anywhere}
.toc a:hover{color:var(--accent)}
.toc a[aria-current="true"]{color:var(--accent);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.chip{font:12px var(--ui);padding:4px 10px;border:1px solid var(--line);border-radius:99px;background:var(--panel);color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:22px 34px 26px;min-width:0;max-width:900px}
.meta{font:12px var(--ui);color:var(--muted);margin:0 0 4px}
.req{font:italic 13.5px/1.45 var(--serif);color:var(--muted);margin:0 0 14px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.h-book{font:700 20px/1.3 var(--serif);text-align:center;margin:16px 0 6px}
.h-part{font:700 17px/1.3 var(--serif);text-align:center;margin:12px 0 8px}
.range{font:12px var(--ui);color:var(--muted);text-align:center;margin-bottom:6px}
.text p,.art{font:15px/1.45 var(--serif);text-align:justify;text-indent:30px;margin:0 0 10px}
.text p.note{font-style:italic}
.text p.tab{text-indent:0;text-align:left}
.art{margin-top:6px}
mark{background:var(--hit);color:var(--hit-ink);padding:0 1px;border-radius:2px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:18px;padding-top:12px;border-top:1px solid var(--line)}
.pager button{font:13px var(--ui);padding:7px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);cursor:pointer;max-width:48%;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pager button:disabled{opacity:.4;cursor:default}
.res{list-style:none;margin:0;padding:0;display:grid;gap:8px;max-width:900px}
.res button{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:10px 14px;color:var(--ink);cursor:pointer;font:inherit}
.res button:hover{border-color:var(--accent)}
.res b{display:block;font:700 15px/1.35 var(--serif)}
.res .src{font-size:12px;color:var(--muted)}
.res .sn{font:14.5px/1.45 var(--serif);margin-top:3px}
.empty{color:var(--muted);padding:32px 8px;text-align:center}
.menu{display:none;font:14px var(--ui);padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);cursor:pointer;margin-bottom:12px}
@media (max-width:820px){
  main{grid-template-columns:minmax(0,1fr)}
  nav{position:static;max-height:60vh}
  .menu{display:inline-block}
  nav.closed{display:none}
  .card{padding:16px}
  .h-book{font-size:18px}
}
</style></head><body>
<div class="wrap">
<header>
  <h1>Нормативна база</h1>
  <div class="sw"><input id="q" type="search" placeholder="Поиск по всем актам: слово, фраза или номер статьи" autocomplete="off" aria-label="Поиск"></div>
  <span class="stat" id="stat">Загрузка…</span>
  <button id="theme" type="button" title="Сменить тему">Тема: авто</button>
</header>
<main>
  <div style="min-width:0">
    <button class="menu" id="menu" type="button">Акты и содержание</button>
    <nav id="nav" class="closed" aria-label="Акти"></nav>
  </div>
  <section id="view" aria-live="polite"><div class="empty">Загружаю тексты актов…</div></section>
</main>
</div>
<script>
(function(){
var ACTS=[],SECS=[],cur={act:null,i:0},collapsed={},filter='all',navEl=document.getElementById('nav'),view=document.getElementById('view'),qEl=document.getElementById('q'),stat=document.getElementById('stat'),tb=document.getElementById('theme');
function esc(s){return s.replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function norm(s){return s.toLowerCase().replace(/[’ʼ`']/g,"'")}
function hl(txt,words){var h=esc(txt);if(!words||!words.length)return h;return h.replace(new RegExp('('+words.map(function(w){return esc(w).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}).join('|')+')','gi'),'<mark>$1</mark>')}
function actOf(id){return ACTS.filter(function(a){return a.id===id})[0]}
function secsOf(id){return SECS.filter(function(s){return s.act===id})}

/* theme: auto -> light -> dark */
var MODES=['auto','light','dark'],LAB={auto:'авто',light:'светлая',dark:'тёмная'},mode='auto';
try{mode=localStorage.getItem('nb-theme')||'auto'}catch(e){}
function applyTheme(){var r=document.documentElement;if(mode==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',mode);tb.textContent='Тема: '+LAB[mode]}
tb.addEventListener('click',function(){mode=MODES[(MODES.indexOf(mode)+1)%3];try{localStorage.setItem('nb-theme',mode)}catch(e){}applyTheme()});
applyTheme();

function renderNav(){
  var h='';
  ACTS.forEach(function(a){
    var on=cur.act===a.id,open=on&&!collapsed[a.id];
    h+='<button class="act" data-act="'+a.id+'" data-toggle="'+(on?1:0)+'" aria-current="'+on+'" aria-expanded="'+open+'" type="button"><span class="chev">'+(open?'▾':'▸')+'</span><span class="nm">'+esc(a.short)+'</span><small>'+esc(a.req)+'</small></button>';
    if(open){h+='<div class="toc">';secsOf(a.id).forEach(function(s){h+='<a data-act="'+a.id+'" data-i="'+s.i+'" aria-current="'+(cur.i===s.i)+'">'+esc(s.t.replace(/ · /g,' — '))+'</a>'});h+='</div>'}
  });
  navEl.innerHTML=h;
  var c=navEl.querySelector('.toc a[aria-current="true"]');if(c&&c.scrollIntoView)try{c.scrollIntoView({block:'nearest'})}catch(e){}
}
function titleHtml(t,w){
  return t.split(' · ').map(function(p){
    if(p==='Преамбула / вступ')return '';
    if(/^(п\.|ч\. )/.test(p))return '<div class="range">'+esc(p)+'</div>';
    var m=/^(Стаття\s+\d+(?:-\d+)?\.)(.*)$/.exec(p);
    if(m)return '<p class="art"><b>'+hl(m[1],w)+'</b>'+hl(m[2],w)+'</p>';
    if(/^(КНИГА|Книга)/.test(p))return '<div class="h-book">'+hl(p,w)+'</div>';
    return '<div class="h-part">'+hl(p,w)+'</div>';
  }).join('');
}
function open(act,i,words){
  if(cur.act!==act)collapsed[act]=false;
  cur={act:act,i:i};if(words&&words.q)qEl.value=words.q;
  var list=secsOf(act),s=list[i];if(!s)return;
  var a=actOf(act),w=(words&&words.w)||[];
  var body=s.x.split('\n').map(function(p){return '<p'+(p.charAt(0)==='{'?' class="note"':(p.indexOf(' | ')>0?' class="tab"':''))+'>'+hl(p,w)+'</p>'}).join('');
  view.innerHTML='<div class="card"><p class="meta">'+esc(a.short)+' · раздел '+(i+1)+' из '+list.length+(a.ed?' · редакция от '+esc(a.ed):'')+'</p><p class="req">'+esc(a.req)+'</p>'+titleHtml(s.t,w)+'<div class="text">'+body+'</div>'+
   '<div class="pager"><button type="button" data-go="-1" '+(i?'':'disabled')+'>← '+esc(i?list[i-1].t.replace(/ · /g,' — '):'')+'</button><button type="button" data-go="1" '+(i<list.length-1?'':'disabled')+'>'+esc(i<list.length-1?list[i+1].t.replace(/ · /g,' — '):'')+' →</button></div></div>';
  renderNav();window.scrollTo(0,0);
  try{history.replaceState(null,'','#'+act+'-'+i)}catch(e){}
}
function search(q){
  q=q.trim();if(!q){open(cur.act||ACTS[0].id,cur.act?cur.i:0);return}
  var words=norm(q).split(/\s+/).filter(Boolean),res=[];
  SECS.forEach(function(s){
    if(filter!=='all'&&s.act!==filter)return;
    var ok=true,n=0,tl=norm(s.t);
    words.forEach(function(w){var p=s.lc.indexOf(w);if(p<0&&tl.indexOf(w)<0)ok=false;else{var c=0,k=-1;while((k=s.lc.indexOf(w,k+1))>=0&&c<200)c++;n+=c}});
    if(!ok)return;
    var score=n+(words.every(function(w){return tl.indexOf(w)>=0})?50:0)+(words.length===1&&/^\d+$/.test(words[0])&&tl.indexOf('стаття '+words[0]+'.')>=0?500:0);
    res.push({s:s,score:score});
  });
  res.sort(function(a,b){return b.score-a.score});
  var chips='<div class="chips"><button class="chip" data-f="all" aria-pressed="'+(filter==='all')+'" type="button">Все акты</button>'+ACTS.map(function(a){return '<button class="chip" data-f="'+a.id+'" aria-pressed="'+(filter===a.id)+'" type="button">'+esc(a.chip)+'</button>'}).join('')+'</div>';
  if(!res.length){view.innerHTML=chips+'<div class="empty">Ничего не найдено по запросу «'+esc(q)+'».</div>';return}
  var shown=res.slice(0,80),h=chips+'<p class="meta">Найдено разделов: '+res.length+(res.length>80?' (показаны первые 80)':'')+'</p><ul class="res">';
  shown.forEach(function(r){
    var s=r.s,p=s.lc.indexOf(words[0]);if(p<0)p=0;
    var from=Math.max(0,p-90),sn=(from?'…':'')+s.x.slice(from,from+260).replace(/\n/g,' ')+'…';
    h+='<li><button type="button" data-act="'+s.act+'" data-i="'+s.i+'"><span class="src">'+esc(actOf(s.act).chip)+' · '+esc(actOf(s.act).short.slice(0,90))+'</span><b>'+hl(s.t.replace(/ · /g,' — '),words)+'</b><div class="sn">'+hl(sn,words)+'</div></button></li>';
  });
  view.innerHTML=h+'</ul>';window.__w={q:q,w:words};
}
var tm;qEl.addEventListener('input',function(){clearTimeout(tm);tm=setTimeout(function(){search(qEl.value)},180)});
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act],[data-f],[data-go],#menu');if(!t)return;
  if(t.id==='menu'){navEl.classList.toggle('closed');return}
  if(t.dataset.f){filter=t.dataset.f;search(qEl.value);return}
  if(t.dataset.go){open(cur.act,cur.i+Number(t.dataset.go));return}
  var a=t.dataset.act;
  if(t.classList.contains('act')&&t.dataset.toggle==='1'){collapsed[a]=!collapsed[a];renderNav();return}
  var i=t.dataset.i?Number(t.dataset.i):0,inRes=!!t.closest('.res'),w=inRes&&window.__w?{q:window.__w.q,w:window.__w.w}:null;
  if(!inRes)qEl.value='';
  open(a,i,w);if(window.innerWidth<=820)navEl.classList.add('closed');
});
function boot(){
  stat.textContent=ACTS.length+' актов · '+SECS.length+' разделов';
  var m=/^#([A-Za-z0-9]+)-(\d+)$/.exec(location.hash||'');
  if(m&&actOf(m[1])){open(m[1],Number(m[2]))}else open(ACTS[0].id,0);
  if(window.innerWidth>820)navEl.classList.remove('closed');
}
function fail(msg){stat.textContent='';view.innerHTML='<div class="empty">'+msg+'</div>'}
fetch('data/index.json').then(function(r){if(!r.ok)throw new Error('index.json: '+r.status);return r.json()}).then(function(list){
  ACTS=list.sort(function(a,b){return a.order-b.order});
  return Promise.all(ACTS.map(function(a){return fetch('data/'+a.id+'.json').then(function(r){if(!r.ok)throw new Error(a.id+': '+r.status);return r.json()})}));
}).then(function(docs){
  docs.forEach(function(d){d.secs.forEach(function(s,i){SECS.push({act:d.id,i:i,t:s.t,x:s.x,lc:norm(s.x)})})});
  boot();
}).catch(function(e){fail('Не удалось загрузить тексты. Откройте сайт по веб-ссылке, а не файлом с компьютера. ('+esc(String(e&&e.message||e))+')')});
})();
</script>
</body></html>
